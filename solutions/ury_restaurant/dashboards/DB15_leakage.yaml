# DB15 Leakage (cancellations, voids, discounts, zero bills). Built from dashboard_portfolio.md section DB15.
# Base queries copied verbatim from semantic_layer.yaml (fact_invoices, fact_cancellations, fact_kot_headers,
# fact_kot_lines, fact_kot_exec). Waiter on cancellations = order owner, not the canceller (R14).
workbook: {id: ury_db15_leakage, title: "URY DB15 Leakage", module: "URY", required_apps: [ury]}
queries:
  # fact_invoices (builder, T1). Grain: one submitted, non-return POS Invoice (the bill).
  # Use for bill counts, ATV, covers (pax, Paid population + Dine In only), order type, waiter, hour/weekday.
  # pax = no_of_pax cast to int (stored as text). Date column: posting_date.
  - id: fact_invoices
    title: "fact_invoices"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 1}
      - {column: is_return, op: "=", value: 0}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
      - {as: pax, type: Integer, expr: "no_of_pax.cast(\"int64\")"}
      - {as: hour_of_day, type: Integer, expr: "hour(posting_time)"}
      - {as: weekday, type: String, expr: "day_name(posting_date)"}
      - {as: is_zero_bill, type: Integer, expr: "if_else(grand_total == 0, 1, 0)"}
      - {as: has_discount, type: Integer, expr: "if_else(discount_amount > 0, 1, 0)"}
    select: [name, posting_date, hour_of_day, weekday, branch, company, order_type, waiter, cashier, custom_waiter_employee, population, pos_profile, restaurant_table, customer, selling_price_list, total, net_total, grand_total, rounded_total, discount_amount, paid_amount, change_amount, total_qty, pax, is_zero_bill, has_discount]


  # fact_cancellations (builder, T1). Grain: one cancelled POS Invoice (docstatus = 2). Value lost = SUM(grand_total).
  # The waiter is the order owner, NOT necessarily the person who cancelled (canceller not stored).
  - id: fact_cancellations
    title: "fact_cancellations"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 2}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
    select: [name, posting_date, branch, company, order_type, waiter, cashier, population, grand_total, cancel_reason, restaurant_table]


  # fact_kot_headers (builder, T2). Grain: one submitted URY KOT. The SLA target is joined from POS Profile
  # (custom_kot_warning_time: 15 'URY', 10 'URY Branch'). prod_minutes = legacy production_time (MINUTES, text);
  # only meaningful when order_status = 'Served' (charts must add that chart filter). Date column: date.
  # department here = EXECUTED production unit (KOT.production); URY Production Department == unit 1:1 today.
  - id: fact_kot_headers
    title: "fact_kot_headers"
    table: "URY KOT"
    joins:
      - {table: "POS Profile", type: left, on: [pos_profile, name], columns: [custom_kot_warning_time, table_attention_time]}
    filters:
      - {column: docstatus, op: "=", value: 1}
    mutate:
      - {as: prod_minutes, type: Decimal, expr: "production_time.cast(\"float64\")"}
      - {as: hour_of_day, type: Integer, expr: "hour(time)"}
      - {as: is_served, type: Integer, expr: "if_else(order_status == 'Served', 1, 0)"}
      - {as: sla_breach, type: Integer, expr: "if_else(production_time.cast(\"float64\") > custom_kot_warning_time, 1, 0)"}
    select: [name, date, hour_of_day, branch, production, type, order_status, is_served, invoice, restaurant_table, pos_profile, user, prod_minutes, custom_kot_warning_time, sla_breach]


  # fact_kot_lines (builder, T1 counts). Grain: one URY KOT Items row (kitchen line). quantity/cancelled_qty are text:
  # cast. Category = raw item_group (Item join); cleaned category is sales-side only. Date column: date.
  - id: fact_kot_lines
    title: "fact_kot_lines"
    table: "URY KOT Items"
    joins:
      - {table: "URY KOT", type: inner, on: [parent, name], columns: [date, time, production, branch, type, order_status, invoice, pos_profile]}
      - {table: "Item", type: left, on: [item, name], columns: [item_group]}
    filters:
      - {column: docstatus, op: "=", value: 1}
    mutate:
      - {as: qty_num, type: Decimal, expr: "quantity.cast(\"float64\")"}
      - {as: cancelled_qty_num, type: Decimal, expr: "cancelled_qty.cast(\"float64\")"}
      - {as: hour_of_day, type: Integer, expr: "hour(time)"}
    select: [name, parent, date, hour_of_day, branch, production, type, order_status, invoice, item, item_name, item_group, course, qty_num, cancelled_qty_num, disposition]


  # fact_kot_exec (sql, T3 on demo: structure ready, stamps milliseconds apart). Grain: one URY KOT Execution per
  # (kot, production_unit), DEDUPED to the latest-modified row (6 KOTs have duplicate QUEUED rows).
  # Why sql: durations need TIMESTAMPDIFF over Datetime (time_diff casts to TIME, drops dates/fractions, sign
  # unverified); dedupe needs ROW_NUMBER(); KOT fire time is TIMESTAMP(KOT.date, KOT.time).
  # TIMESTAMPDIFF(SECOND, a, b) = b - a (MariaDB). Date column: exec_date. department = executed unit's department.
  - id: fact_kot_exec
    title: "fact_kot_exec"
    sql: "WITH ex AS (SELECT e.*, ROW_NUMBER() OVER (PARTITION BY e.kot, e.production_unit ORDER BY e.modified DESC) AS rn FROM `tabURY KOT Execution` e) SELECT ex.name, ex.kot, ex.state, ex.production_unit, COALESCE(NULLIF(pu.department, ''), ex.production_unit) AS department, ex.branch, ex.company, DATE(COALESCE(ex.started_at, ex.creation)) AS exec_date, HOUR(k.time) AS hour_of_day, k.type AS kot_type, ex.started_by, ex.ready_by, ex.served_by, ex.cancelled_by, pp.custom_kot_warning_time AS target_minutes, TIMESTAMPDIFF(SECOND, ex.creation, ex.started_at) AS queue_seconds, TIMESTAMPDIFF(SECOND, ex.started_at, ex.ready_at) AS prep_seconds, TIMESTAMPDIFF(SECOND, ex.ready_at, ex.served_at) AS pass_seconds, TIMESTAMPDIFF(SECOND, ex.started_at, ex.served_at) AS cycle_seconds, TIMESTAMPDIFF(SECOND, TIMESTAMP(k.date, k.time), ex.served_at) AS order_to_serve_seconds, CASE WHEN ex.state LIKE 'CANCELLED%' THEN 1 ELSE 0 END AS is_cancelled, CASE WHEN ex.state IN ('CANCELLED_AFTER_START','CANCELLED_AFTER_READY') THEN 1 ELSE 0 END AS wasted_prep, CASE WHEN ex.started_at IS NOT NULL THEN 1 ELSE 0 END AS was_started, CASE WHEN ex.ready_at IS NOT NULL THEN 1 ELSE 0 END AS was_ready, CASE WHEN ex.served_at IS NOT NULL THEN 1 ELSE 0 END AS was_served FROM ex JOIN `tabURY KOT` k ON k.name = ex.kot LEFT JOIN `tabURY Production Unit` pu ON pu.name = ex.production_unit LEFT JOIN `tabPOS Profile` pp ON pp.name = k.pos_profile WHERE ex.rn = 1 AND k.docstatus IN (1, 2)"


charts:
  # S1 KPIs
  - {id: db15_kpi, title: "Cancelled Bills and Value Lost", query: fact_cancellations, type: Number,
     y: [{column: name, agg: count, as: Cancelled Bills}, {column: grand_total, agg: sum, as: Value Lost, format: currency}]}
  - {id: db15_base, title: "Net Sales Base and Zero Bills", query: fact_invoices, type: Number,
     y: [{column: net_total, agg: sum, as: Net Sales, format: currency}, {column: is_zero_bill, agg: sum, as: Zero Bills}]}
  - {id: db15_disc, title: "Discounts Given (T3)", query: fact_invoices, type: Number,
     y: [{column: discount_amount, agg: sum, as: Discount Amount, format: currency}, {column: has_discount, agg: sum, as: Discounted Bills}]}
  # S2 Why and where
  - {id: db15_reason, title: "Cancellations by Reason", query: fact_cancellations, type: Row, limit: 15,
     x: cancel_reason, y: [{column: name, agg: count, as: Cancelled Bills}, {column: grand_total, agg: sum, as: Value Lost, format: currency}],
     order: [{by: Value Lost, dir: desc}]}
  - {id: db15_ot, title: "Cancellations by Order Type", query: fact_cancellations, type: Donut, limit: 10,
     x: order_type, y: [{column: name, agg: count, as: Cancelled Bills}], order: [{by: Cancelled Bills, dir: desc}]}
  - {id: db15_trend, title: "Cancellations per Week", query: fact_cancellations, type: Bar, limit: 366,
     x: {column: posting_date, granularity: week}, y: [{column: name, agg: count, as: Cancelled Bills}]}
  # S3 Who
  - {id: db15_waiter, title: "Cancelled Value by Order Owner", query: fact_cancellations, type: Row, limit: 15,
     x: waiter, y: [{column: grand_total, agg: sum, as: Value Lost, format: currency}], order: [{by: Value Lost, dir: desc}]}
  - {id: db15_disc_cashier, title: "Discount by Cashier (T3)", query: fact_invoices, type: Row, limit: 15,
     filters: [{column: has_discount, op: "=", value: 1}],
     x: cashier, y: [{column: discount_amount, agg: sum, as: Discount Amount, format: currency}], order: [{by: Discount Amount, dir: desc}]}
  # S4 Kitchen side
  - {id: db15_stage, title: "Kitchen Cancellations by Stage", query: fact_kot_exec, type: Bar, limit: 10,
     filters: [{column: is_cancelled, op: "=", value: 1}],
     x: state, y: [{column: name, agg: count, as: Cancelled Tickets}]}
  - {id: db15_modified, title: "Modified Orders (KOT)", query: fact_kot_headers, type: Number,
     filters: [{column: type, op: "=", value: "Order Modified"}],
     y: [{column: name, agg: count, as: Modified KOTs}]}
  - {id: db15_voids, title: "Voided Kitchen Quantity", query: fact_kot_lines, type: Number,
     y: [{column: cancelled_qty_num, agg: sum, as: Voided Qty}]}
dashboards:
  - id: leakage
    title: "Leakage"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, default: {op: within, value: "Last 90 days"},
         applies_to: {fact_cancellations: posting_date, fact_invoices: posting_date, fact_kot_exec: exec_date, fact_kot_headers: date, fact_kot_lines: date}}
      - {id: f_branch, label: Branch, type: string, icon: building-2,
         applies_to: {fact_cancellations: branch, fact_invoices: branch, fact_kot_exec: branch, fact_kot_headers: branch, fact_kot_lines: branch}}
      - {id: f_waiter, label: Waiter, type: string, icon: user,
         applies_to: {fact_cancellations: waiter, fact_invoices: waiter}}
      - {id: f_order_type, label: Order Type, type: string, icon: utensils,
         applies_to: {fact_cancellations: order_type, fact_invoices: order_type}}
    items:
      - {chart: db15_kpi, x: 0, y: 1, w: 8, h: 3}
      - {chart: db15_base, x: 8, y: 1, w: 6, h: 3}
      - {chart: db15_disc, x: 14, y: 1, w: 6, h: 3}
      - {chart: db15_reason, x: 0, y: 4, w: 10, h: 8}
      - {chart: db15_ot, x: 10, y: 4, w: 5, h: 8}
      - {chart: db15_trend, x: 15, y: 4, w: 5, h: 8}
      - {chart: db15_waiter, x: 0, y: 12, w: 10, h: 7}
      - {chart: db15_disc_cashier, x: 10, y: 12, w: 10, h: 7}
      - {chart: db15_stage, x: 0, y: 19, w: 7, h: 7}
      - {chart: db15_modified, x: 7, y: 19, w: 6, h: 3}
      - {chart: db15_voids, x: 13, y: 19, w: 7, h: 3}
      - {text: "<p><b>Waiter = order owner</b>, not necessarily the canceller (not stored, R14). <b>T3</b> discounts: only 4 bills, 31.89 total. <b>T4</b> SAL-018 returns: none recorded. Cancel reason is free text.</p>", x: 7, y: 22, w: 13, h: 4}
desk: {workspace: "URY", label: "Leakage"}
