# DB14 Data quality & capture readiness (audience: data owner, owner; monthly). Portfolio section DB14.
# Scoreboard of the capture roadmap: per level and domain, which numbers are trustworthy and what to capture next.
# Base queries below are copied VERBATIM from semantic_layer.yaml (same ids/titles/comments), only those this dashboard reads.
# fact_sales_plan_items is listed in the portfolio's Queries line but no DB14 chart reads it (PLN-011 comes from dim_item),
# so it is not copied (lint L24 would flag an unused query).
# Date filter has NO default here on purpose: data-quality counts are all-history counts (62 of 202 items, 2102/1075 bills);
# a "Last 90 days" default would silently shrink them (demo history starts 2025-08-06).
workbook: {id: ury_db14_data_quality, title: "URY DB14 Data Quality", module: "URY", required_apps: [ury]}
queries:
  # fact_invoices (builder, T1). Grain: one submitted, non-return POS Invoice (the bill).
  # Use for bill counts, ATV, covers (pax, Paid population + Dine In only), order type, waiter, hour/weekday.
  # pax = no_of_pax cast to int (stored as text). Date column: posting_date.
  - id: fact_invoices
    title: "fact_invoices"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 1}
      - {column: is_return, op: "=", value: 0}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
      - {as: pax, type: Integer, expr: "no_of_pax.cast(\"int64\")"}
      - {as: hour_of_day, type: Integer, expr: "hour(posting_time)"}
      - {as: weekday, type: String, expr: "day_name(posting_date)"}
      - {as: is_zero_bill, type: Integer, expr: "if_else(grand_total == 0, 1, 0)"}
      - {as: has_discount, type: Integer, expr: "if_else(discount_amount > 0, 1, 0)"}
    select: [name, posting_date, hour_of_day, weekday, branch, company, order_type, waiter, cashier, custom_waiter_employee, population, pos_profile, restaurant_table, customer, selling_price_list, total, net_total, grand_total, rounded_total, discount_amount, paid_amount, change_amount, total_qty, pax, is_zero_bill, has_discount]

  # fact_sales_lines_enriched (sql, T1/T2). Same grain as fact_sales_lines plus: cleaned menu_category and
  # category_family (CATEGORY_MAP v1), branch-safe configured department, BOM-based estimated cost.
  # Why sql: (1) the cleaned category is a 60-value CASE over Item Group; (2) the config join needs a composite key
  # (item AND branch), finsights joins take one equality pair; (3) BOM unit cost needs a filtered sub-select
  # (is_default=1, is_active=1, docstatus=1). Date column: posting_date. est_cost/est_margin are NULL when no recipe cost.
  - id: fact_sales_lines_enriched
    title: "fact_sales_lines_enriched"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item) SELECT pii.name AS line_id, pi.name AS invoice, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, pi.branch, pi.company, pi.order_type, pi.waiter, pi.cashier, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pii.item_code, pii.item_name, pii.item_group, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, COALESCE(NULLIF(ipc.department, ''), 'Unmapped') AS department, COALESCE(NULLIF(ipc.production_unit, ''), 'Unmapped') AS config_unit, ipc.production_policy, pii.warehouse, pii.qty, pii.amount AS gross_amount, pii.net_amount, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS cost_known, pii.qty * bc.bom_unit_cost AS est_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount END AS costed_net_amount, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount - pii.qty * bc.bom_unit_cost END AS est_margin FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 LEFT JOIN cm ON cm.item_group = pii.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = pii.item_code AND ipc.branch = pi.branch AND ipc.active = 1 LEFT JOIN bc ON bc.item = pii.item_code"

  # ---------------------------------------------------------------- TABLES / FLOOR
  # fact_table_sessions (sql, T2/T3). Grain: one submitted Dine In POS Invoice with its table, room and seats.
  # dwell_minutes = total_spend_time ('HH:MM:SS' text, = invoice creation -> submit, NOT seat -> clear).
  # dwell_valid = 1 only for 0 < dwell <= 480 min. Why sql: TIME_TO_SEC on a text duration, and room/seats come from
  # URY Table while the invoice room field is half empty. Date column: posting_date.
  - id: fact_table_sessions
    title: "fact_table_sessions"
    sql: "SELECT pi.name, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, DAYNAME(pi.posting_date) AS weekday, pi.branch, pi.company, pi.waiter, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pi.restaurant_table, COALESCE(t.restaurant_room, 'No room') AS room, t.no_of_seats, COALESCE(t.is_take_away, 0) AS is_take_away, pi.net_total, CAST(COALESCE(NULLIF(pi.no_of_pax, ''), '0') AS UNSIGNED) AS pax, TIME_TO_SEC(pi.total_spend_time) / 60 AS dwell_minutes, CASE WHEN TIME_TO_SEC(pi.total_spend_time) > 0 AND TIME_TO_SEC(pi.total_spend_time) <= 28800 THEN 1 ELSE 0 END AS dwell_valid, CASE WHEN CAST(COALESCE(NULLIF(pi.no_of_pax, ''), '0') AS UNSIGNED) > t.no_of_seats THEN 1 ELSE 0 END AS over_capacity FROM `tabPOS Invoice` pi LEFT JOIN `tabURY Table` t ON t.name = pi.restaurant_table WHERE pi.docstatus = 1 AND pi.is_return = 0 AND pi.order_type = 'Dine In'"

  # fact_kot_exec (sql, T3 on demo: structure ready, stamps milliseconds apart). Grain: one URY KOT Execution per
  # (kot, production_unit), DEDUPED to the latest-modified row (6 KOTs have duplicate QUEUED rows).
  # Why sql: durations need TIMESTAMPDIFF over Datetime (time_diff casts to TIME, drops dates/fractions, sign
  # unverified); dedupe needs ROW_NUMBER(); KOT fire time is TIMESTAMP(KOT.date, KOT.time).
  # TIMESTAMPDIFF(SECOND, a, b) = b - a (MariaDB). Date column: exec_date. department = executed unit's department.
  - id: fact_kot_exec
    title: "fact_kot_exec"
    sql: "WITH ex AS (SELECT e.*, ROW_NUMBER() OVER (PARTITION BY e.kot, e.production_unit ORDER BY e.modified DESC) AS rn FROM `tabURY KOT Execution` e) SELECT ex.name, ex.kot, ex.state, ex.production_unit, COALESCE(NULLIF(pu.department, ''), ex.production_unit) AS department, ex.branch, ex.company, DATE(COALESCE(ex.started_at, ex.creation)) AS exec_date, HOUR(k.time) AS hour_of_day, k.type AS kot_type, ex.started_by, ex.ready_by, ex.served_by, ex.cancelled_by, pp.custom_kot_warning_time AS target_minutes, TIMESTAMPDIFF(SECOND, ex.creation, ex.started_at) AS queue_seconds, TIMESTAMPDIFF(SECOND, ex.started_at, ex.ready_at) AS prep_seconds, TIMESTAMPDIFF(SECOND, ex.ready_at, ex.served_at) AS pass_seconds, TIMESTAMPDIFF(SECOND, ex.started_at, ex.served_at) AS cycle_seconds, TIMESTAMPDIFF(SECOND, TIMESTAMP(k.date, k.time), ex.served_at) AS order_to_serve_seconds, CASE WHEN ex.state LIKE 'CANCELLED%' THEN 1 ELSE 0 END AS is_cancelled, CASE WHEN ex.state IN ('CANCELLED_AFTER_START','CANCELLED_AFTER_READY') THEN 1 ELSE 0 END AS wasted_prep, CASE WHEN ex.started_at IS NOT NULL THEN 1 ELSE 0 END AS was_started, CASE WHEN ex.ready_at IS NOT NULL THEN 1 ELSE 0 END AS was_ready, CASE WHEN ex.served_at IS NOT NULL THEN 1 ELSE 0 END AS was_served FROM ex JOIN `tabURY KOT` k ON k.name = ex.kot LEFT JOIN `tabURY Production Unit` pu ON pu.name = ex.production_unit LEFT JOIN `tabPOS Profile` pp ON pp.name = k.pos_profile WHERE ex.rn = 1 AND k.docstatus IN (1, 2)"

  # fact_yield_checks (builder, T1 item level; department EMPTY). Grain: one URY Yield Check (not submittable).
  # Weighted yield % = SUM(output_qty)/SUM(input_qty)*100 per UOM; never AVG(actual_yield_percent), never mix Kg/Litre.
  # variance_percent is in percentage POINTS. Tolerance for out_of_tolerance = 5 points (architecture decision).
  # Date column: checked_on (Datetime).
  - id: fact_yield_checks
    title: "fact_yield_checks"
    table: "URY Yield Check"
    joins:
      - {table: "Item", type: left, on: [item, name], columns: [item_name, item_group]}
    mutate:
      - {as: expected_output, type: Decimal, expr: "input_qty * standard_yield_percent_snapshot / 100"}
      - {as: yield_loss_qty, type: Decimal, expr: "input_qty * standard_yield_percent_snapshot / 100 - output_qty"}
      - {as: below_standard, type: Integer, expr: "if_else(variance_percent < 0, 1, 0)"}
      - {as: out_of_tolerance, type: Integer, expr: "if_else(variance_percent < -5, 1, 0)"}
    select: [name, checked_on, branch, company, department, production_unit, item, item_name, item_group, stock_uom, check_type, checked_by, input_qty, output_qty, expected_output, yield_loss_qty, actual_yield_percent, standard_yield_percent_snapshot, variance_percent, below_standard, out_of_tolerance]

  # fact_wastage_lines (builder, T4 on demo: 0 rows). Grain: one Wastage Item of a submitted URY Wastage.
  # Dashboards show an empty-state text block until rows exist (verify --min-rows 0 for this query only).
  - id: fact_wastage_lines
    title: "fact_wastage_lines"
    table: "Wastage Item"
    joins:
      - {table: "URY Wastage", type: inner, on: [parent, name], columns: [posting_date, branch, company, department, production_unit, reason_category, status, captured_by, approved_by]}
    filters:
      - {column: docstatus, op: "=", value: 1}
    select: [name, parent, posting_date, branch, company, department, production_unit, reason_category, status, captured_by, approved_by, item_code, item_name, uom, qty, rate, amount]

  # ---------------------------------------------------------------- DIMENSIONS
  # dim_item (sql). Grain: one Item x configured branch (one row per item while single-branch). Carries CATEGORY_MAP v1
  # (identical CASE to fact_sales_lines_enriched), configured department/unit/policy, recipe-cost coverage and yield
  # standard. Why sql: same CASE + composite/filtered joins as above. Use for coverage and data-quality charts.
  - id: dim_item
    title: "dim_item"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item), sold AS (SELECT DISTINCT pii.item_code FROM `tabPOS Invoice Item` pii WHERE pii.docstatus = 1) SELECT i.name AS item_code, i.item_name, i.item_group, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, ipc.branch, COALESCE(NULLIF(ipc.department, ''), 'Unmapped') AS department, COALESCE(NULLIF(ipc.production_unit, ''), 'Unmapped') AS config_unit, ipc.production_policy, ipc.controlled_by_sales_plan, i.is_stock_item, i.is_sales_item, i.disabled, CASE WHEN sold.item_code IS NULL THEN 0 ELSE 1 END AS is_sold, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS has_recipe_cost, i.valuation_rate, i.custom_yield_tracked, i.custom_yield_percent FROM `tabItem` i LEFT JOIN cm ON cm.item_group = i.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = i.name AND ipc.active = 1 LEFT JOIN bc ON bc.item = i.name LEFT JOIN sold ON sold.item_code = i.name"

charts:
  # ---- S1 Populations and attribution
  - {id: db14_population, title: "Invoice Population Split (DQ-001)", query: fact_invoices, type: Donut, limit: 10,
     x: population, y: [{column: name, agg: count, as: Bills}], order: [{by: Bills, dir: desc}]}
  - {id: db14_pax, title: "Dine-in Bills with Covers by Population (DQ-004)", query: fact_invoices, type: Bar, limit: 10,
     filters: [{column: order_type, op: "=", value: "Dine In"}],
     x: population, y: [{column: name, agg: count, as: Bills}, {column: pax, agg: sum, as: Covers}]}
  - {id: db14_emp_link, title: "Bills with Waiter Employee Link (DQ-006)", query: fact_invoices, type: Number,
     filters: [{column: custom_waiter_employee, op: is_set}],
     y: [{column: name, agg: count, as: "Bills with Employee Link"}]}
  - {id: db14_branches, title: "Branches and Companies with Data (DQ-011)", query: fact_invoices, type: Number,
     y: [{column: branch, agg: count_distinct, as: Branches}, {column: company, agg: count_distinct, as: Companies}]}
  # ---- S2 Mapping gaps
  - {id: db14_unmapped, title: "Revenue with No Department (DQ-002)", query: fact_sales_lines_enriched, type: Number,
     filters: [{column: department, op: "=", value: Unmapped}],
     y: [{column: net_amount, agg: sum, as: "Unmapped Revenue", format: currency}]}
  - {id: db14_unassigned, title: "Revenue in Unassigned Category (DQ-003)", query: fact_sales_lines_enriched, type: Number,
     filters: [{column: menu_category, op: "=", value: Unassigned}],
     y: [{column: net_amount, agg: sum, as: "Unassigned Revenue", format: currency}]}
  # 202 = Item Production Configuration rows (one per configured item), 62 of them have no department (R10).
  # dim_item.branch is set only when the item has an active configuration row, so is_set on branch = configured items.
  - {id: db14_items_nodept, title: "Configured Items without Department (DQ-002)", query: dim_item, type: Number,
     filters: [{column: branch, op: is_set}],
     y: [{expr: "count_if(department == 'Unmapped')", agg: sum, as: "Items without Department"}, {column: item_code, agg: count, as: "Configured Items"}]}
  - {id: db14_recipe, title: "Sold Items with Recipe Cost (DQ-007)", query: dim_item, type: Number,
     filters: [{column: is_sold, op: "=", value: 1}],
     y: [{column: has_recipe_cost, agg: sum, as: "With Recipe Cost"}, {column: item_code, agg: count, as: "Sold Items"}]}
  - {id: db14_plan_ctrl, title: "Items Controlled by Sales Plan (PLN-011)", query: dim_item, type: Number,
     y: [{column: controlled_by_sales_plan, agg: sum, as: "Plan-controlled Items"}]}
  # ---- S3 Capture counters
  - {id: db14_dwell, title: "Dine-in Bills with Valid Dwell (DQ-005)", query: fact_table_sessions, type: Number,
     y: [{column: dwell_valid, agg: sum, as: "Valid Dwell"}, {column: name, agg: count, as: "Dine-in Bills"}]}
  - {id: db14_actor, title: "Kitchen Rows with Real Actor (DQ-008)", query: fact_kot_exec, type: Number,
     filters: [{column: started_by, op: "!=", value: Administrator}, {column: started_by, op: is_set}],
     y: [{column: name, agg: count, as: "Real Actor Rows"}]}
  - {id: db14_yield_dept, title: "Yield Checks with Department (DQ-009)", query: fact_yield_checks, type: Number,
     filters: [{column: department, op: is_set}],
     y: [{column: name, agg: count, as: "With Department"}]}
  - {id: db14_waste, title: "Wastage Lines Recorded (DQ-010)", query: fact_wastage_lines, type: Number,
     y: [{column: name, agg: count, as: "Wastage Lines"}]}
  # ---- S4 Non-selling items
  # Chart filters use != 1 instead of = 0 (value 0 is falsy in the UI). The Table is a PIVOT (columns: category_family) on purpose: the 3.15.1 dashboard
  # frontend calls config.columns.filter(), and the compiler omits an empty `columns`, so a flat Table renders 'No data' and throws.
  - {id: db14_nonselling, title: "Sales Items Never Sold by Category (MNU-011)", query: dim_item, type: Table, limit: 50,
     filters: [{column: is_sales_item, op: "=", value: 1}, {column: is_sold, op: "!=", value: 1}, {column: disabled, op: "!=", value: 1}],
     rows: [menu_category], columns: [category_family], y: [{column: item_code, agg: count, as: Items}]}
dashboards:
  - id: data_quality
    title: "URY DB14 Data Quality"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, applies_to: {fact_invoices: posting_date, fact_sales_lines_enriched: posting_date, fact_table_sessions: posting_date, fact_kot_exec: exec_date, fact_yield_checks: checked_on, fact_wastage_lines: posting_date}}
      - {id: f_branch, label: Branch, type: string, icon: store, applies_to: {fact_invoices: branch, fact_sales_lines_enriched: branch, fact_table_sessions: branch, fact_kot_exec: branch, fact_yield_checks: branch, fact_wastage_lines: branch}}
    items:
      # S0 readiness table: six levels x seven domains, tier from the metric dictionary, roadmap id per gap.
      - text: "<p><b>Readiness by level and domain</b> (tier: T1 ready, T2 caveat, T3 data empty/too small, T4 needs new capture; roadmap id in brackets)</p><table><thead><tr><th>Level</th><th>Sales</th><th>Kitchen</th><th>Margin</th><th>Waste</th><th>Yield</th><th>Tables</th><th>People</th></tr></thead><tbody><tr><td><b>Company</b></td><td>T3 one company</td><td>T3</td><td>T3</td><td>T4 [R1]</td><td>T3</td><td>T3</td><td>-</td></tr><tr><td><b>Branch</b></td><td>T3 one branch [R11]</td><td>T3</td><td>T3 [R11]</td><td>T4 [R1]</td><td>T3</td><td>T3 [R5, R9]</td><td>-</td></tr><tr><td><b>Department</b></td><td>T2 17.4% unmapped [R10]</td><td>T1 counts, executed unit</td><td>T2 recipe estimate [R2]</td><td>T4 [R1]</td><td>T4 [R8]</td><td>-</td><td>-</td></tr><tr><td><b>Item</b></td><td>T1</td><td>T1</td><td>T2 [R2]</td><td>T4 [R1]</td><td>T1</td><td>-</td><td>-</td></tr><tr><td><b>Category</b></td><td>T1 cleaned map [R6]</td><td>T2 raw item group</td><td>T2 [R2]</td><td>T4 [R1]</td><td>T2 raw item group</td><td>-</td><td>-</td></tr><tr><td><b>Employee</b></td><td>T1 Paid bills only [R7]</td><td>T4 [R4]</td><td>none by design</td><td>T4 [R1]</td><td>T2 checker [R8]</td><td>T3 [R5]</td><td>T1 Paid only / T4 HR link [R3]</td></tr></tbody></table>"
        x: 0
        y: 1
        w: 20
        h: 8
      - {chart: db14_population, x: 0, y: 9, w: 6, h: 8}
      - {chart: db14_pax, x: 6, y: 9, w: 7, h: 8}
      - {chart: db14_emp_link, x: 13, y: 9, w: 7, h: 4}
      - {chart: db14_branches, x: 13, y: 13, w: 7, h: 4}
      - {chart: db14_unmapped, x: 0, y: 17, w: 10, h: 3}
      - {chart: db14_unassigned, x: 10, y: 17, w: 10, h: 3}
      - {chart: db14_items_nodept, x: 0, y: 20, w: 8, h: 3}
      - {chart: db14_recipe, x: 8, y: 20, w: 7, h: 3}
      - {chart: db14_plan_ctrl, x: 15, y: 20, w: 5, h: 3}
      - {chart: db14_dwell, x: 0, y: 23, w: 5, h: 3}
      - {chart: db14_actor, x: 5, y: 23, w: 5, h: 3}
      - {chart: db14_yield_dept, x: 10, y: 23, w: 5, h: 3}
      - {chart: db14_waste, x: 15, y: 23, w: 5, h: 3}
      - {chart: db14_nonselling, x: 0, y: 26, w: 10, h: 7}
      - text: "<p><b>T4 Capture roadmap (ranked)</b>: R1 wastage logging (WST-001..005, KIT-016); R2 ingredient purchase rates and recipes (MAR-006..008, MNU-012, YLD-009); R3 Employee.user_id for POS/kitchen users (EMP-013/014); R4 real KOT actors and stamps (KIT-006..010, KIT-018, DQ-008); R5 seat/clear timestamps (TBL-009/010); R6 category tree (MNU-005, DQ-003); R7 covers as Int, dine-in only (SAL-015/016); R8 yield check department and checker (YLD-008, DQ-009); R9 opening hours (RevPASH, utilisation); R10 department for unmapped items (DQ-002, PRD-001); R11 branch on cash-up and stock; R12 tips and service charge (SAL-019); R13 monthly targets (SAL-021); R14 controlled cancel/discount reasons (LKG-004, EMP-008); R15 plan committed qty, returns, QR ordering (PLN-009, SAL-018, SAL-020).</p>"
        x: 10
        y: 26
        w: 10
        h: 7
