# DB08 Employee performance (waiter / cashier). Indicators, not verdicts. Waiter and covers metrics are Paid-population only.
# L1 queries below are copied verbatim from semantic_layer.yaml (ids, titles, operations, comments).
workbook: {id: ury_db08_employee_performance, title: "URY DB08 Employee Performance", module: "URY", required_apps: [ury]}
queries:
  # fact_invoices (builder, T1). Grain: one submitted, non-return POS Invoice (the bill).
  # Use for bill counts, ATV, covers (pax, Paid population + Dine In only), order type, waiter, hour/weekday.
  # pax = no_of_pax cast to int (stored as text). Date column: posting_date.
  - id: fact_invoices
    title: "fact_invoices"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 1}
      - {column: is_return, op: "=", value: 0}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
      - {as: pax, type: Integer, expr: "no_of_pax.cast(\"int64\")"}
      - {as: hour_of_day, type: Integer, expr: "hour(posting_time)"}
      - {as: weekday, type: String, expr: "day_name(posting_date)"}
      - {as: is_zero_bill, type: Integer, expr: "if_else(grand_total == 0, 1, 0)"}
      - {as: has_discount, type: Integer, expr: "if_else(discount_amount > 0, 1, 0)"}
    select: [name, posting_date, hour_of_day, weekday, branch, company, order_type, waiter, cashier, custom_waiter_employee, population, pos_profile, restaurant_table, customer, selling_price_list, total, net_total, grand_total, rounded_total, discount_amount, paid_amount, change_amount, total_qty, pax, is_zero_bill, has_discount]

  # fact_sales_lines_enriched (sql, T1/T2). Same grain as fact_sales_lines plus: cleaned menu_category and
  # category_family (CATEGORY_MAP v1), branch-safe configured department, BOM-based estimated cost.
  # Why sql: (1) the cleaned category is a 60-value CASE over Item Group; (2) the config join needs a composite key
  # (item AND branch), finsights joins take one equality pair; (3) BOM unit cost needs a filtered sub-select
  # (is_default=1, is_active=1, docstatus=1). Date column: posting_date. est_cost/est_margin are NULL when no recipe cost.
  - id: fact_sales_lines_enriched
    title: "fact_sales_lines_enriched"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item) SELECT pii.name AS line_id, pi.name AS invoice, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, pi.branch, pi.company, pi.order_type, pi.waiter, pi.cashier, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pii.item_code, pii.item_name, pii.item_group, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, COALESCE(NULLIF(ipc.department, ''), 'Unmapped') AS department, COALESCE(NULLIF(ipc.production_unit, ''), 'Unmapped') AS config_unit, ipc.production_policy, pii.warehouse, pii.qty, pii.amount AS gross_amount, pii.net_amount, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS cost_known, pii.qty * bc.bom_unit_cost AS est_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount END AS costed_net_amount, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount - pii.qty * bc.bom_unit_cost END AS est_margin FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 LEFT JOIN cm ON cm.item_group = pii.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = pii.item_code AND ipc.branch = pi.branch AND ipc.active = 1 LEFT JOIN bc ON bc.item = pii.item_code"

  # fact_cancellations (builder, T1). Grain: one cancelled POS Invoice (docstatus = 2). Value lost = SUM(grand_total).
  # The waiter is the order owner, NOT necessarily the person who cancelled (canceller not stored).
  - id: fact_cancellations
    title: "fact_cancellations"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 2}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
    select: [name, posting_date, branch, company, order_type, waiter, cashier, population, grand_total, cancel_reason, restaurant_table]

charts:
  # Staff performance (UX change list DB08). Person labels still show login ids: full names need a User join in
  # fact_invoices / fact_cancellations (shared semantic layer), pending. Administrator is excluded per chart.
  # KPI row (Paid only)
  - {id: db08_kpi_atv, title: "Average bill (₹)", query: fact_invoices, type: Number,
     y: [{expr: "(sum(net_total) / count(name)).round(0)", as: Average bill, format: currency}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  - {id: db08_kpi_items, title: "Items per bill", query: fact_invoices, type: Number,
     y: [{expr: "(sum(total_qty) / count(name)).round(1)", as: Items per bill}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  - {id: db08_kpi_cover, title: "Spend per cover (₹)", query: fact_invoices, type: Number,
     y: [{expr: "(sum(net_total) / sum(pax)).round(0)", as: Spend per cover, format: currency}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: order_type, op: "=", value: "Dine In"}, {column: pax, op: ">", value: 0}, {column: waiter, op: "!=", value: "Administrator"}]}
  - {id: db08_kpi_waiters, title: "Waiters active", query: fact_invoices, type: Number,
     y: [{column: waiter, agg: count_distinct, as: Waiters active}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  # S1 Waiters (Paid only)
  - {id: db08_sales, title: "Net sales by waiter (₹)", query: fact_invoices, type: Row, limit: 15,
     x: waiter, y: [{expr: "(sum(net_total)).round(0)", as: Net sales, format: currency}],
     order: [{by: Net sales, dir: desc}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  - {id: db08_bills_atv, title: "Bills and average bill by waiter", query: fact_invoices, type: Table, limit: 15,
     rows: [waiter],
     y: [{column: name, agg: count, as: Bills},
         {expr: "(sum(net_total) / count(name)).round(0)", as: Average bill (₹), format: currency},
         {expr: "(sum(total_qty) / count(name)).round(1)", as: Items per bill}],
     order: [{by: Bills, dir: desc}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  # S2 Upsell
  - {id: db08_mix, title: "Beverage share of sales by waiter (%)", query: fact_sales_lines_enriched, type: Row, limit: 15,
     x: waiter,
     y: [{expr: "sum(if_else(category_family == 'Beverage', net_amount, 0)) / sum(net_amount)", as: Beverage share, format: percent}],
     order: [{by: Beverage share, dir: desc}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: waiter, op: "!=", value: "Administrator"}]}
  - {id: db08_covers, title: "Covers and spend per cover by waiter", query: fact_invoices, type: Table, limit: 15,
     rows: [waiter],
     y: [{column: pax, agg: sum, as: Covers},
         {expr: "(sum(net_total) / sum(pax)).round(0)", as: Spend per cover (₹), format: currency}],
     order: [{by: Covers, dir: desc}],
     filters: [{column: population, op: "=", value: "Paid"}, {column: order_type, op: "=", value: "Dine In"}, {column: pax, op: ">", value: 0}, {column: waiter, op: "!=", value: "Administrator"}]}
  # S3 Leakage owners (waiter = order owner, not necessarily who cancelled)
  - {id: db08_cancels, title: "Cancelled value by order taker (₹)", query: fact_cancellations, type: Row, limit: 15,
     x: waiter, y: [{expr: "(sum(grand_total)).round(0)", as: Cancelled value, format: currency}],
     order: [{by: Cancelled value, dir: desc}],
     filters: [{column: waiter, op: "!=", value: "Administrator"}]}
  # S4 Cashiers
  - {id: db08_cashier, title: "Net sales by cashier (₹)", query: fact_invoices, type: Row, limit: 15,
     x: cashier, y: [{expr: "(sum(net_total)).round(0)", as: Net sales, format: currency}],
     order: [{by: Net sales, dir: desc}],
     filters: [{column: cashier, op: "!=", value: "Administrator"}]}
dashboards:
  - id: employee_performance
    title: "Staff performance"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, default: {op: within, value: "Last 90 days"}, layout: {x: 0, y: 2, w: 5, h: 1},
         applies_to: {fact_invoices: posting_date, fact_sales_lines_enriched: posting_date, fact_cancellations: posting_date}}
      - {id: f_branch, label: Branch, type: string, icon: building-2, layout: {x: 5, y: 2, w: 5, h: 1},
         applies_to: {fact_invoices: branch, fact_sales_lines_enriched: branch, fact_cancellations: branch}}
      - {id: f_waiter, label: Waiter, type: string, icon: user, layout: {x: 10, y: 2, w: 5, h: 1},
         applies_to: {fact_invoices: waiter, fact_sales_lines_enriched: waiter, fact_cancellations: waiter}}
      - {id: f_order_type, label: Order type, type: string, icon: utensils, layout: {x: 15, y: 2, w: 5, h: 1},
         applies_to: {fact_invoices: order_type, fact_sales_lines_enriched: order_type}}
    items:
      - {text: "<p><b>Staff performance, for managers only.</b> Use it to coach, not to judge: sales count for the person on the bill, cancellations for whoever opened the order. Paid bills only; default last 90 days.</p>", x: 0, y: 0, w: 20, h: 2}
      - {chart: db08_kpi_atv, x: 0, y: 3, w: 5, h: 3}
      - {chart: db08_kpi_items, x: 5, y: 3, w: 5, h: 3}
      - {chart: db08_kpi_cover, x: 10, y: 3, w: 5, h: 3}
      - {chart: db08_kpi_waiters, x: 15, y: 3, w: 5, h: 3}
      - {text: "<p><b>Sales and bills</b> - who sells and how big each bill is</p>", x: 0, y: 6, w: 20, h: 1}
      - {chart: db08_sales, x: 0, y: 7, w: 10, h: 8}
      - {chart: db08_bills_atv, x: 10, y: 7, w: 10, h: 8}
      - {text: "<p><b>Upsell and covers</b> - who sells more drinks and earns more per guest</p>", x: 0, y: 15, w: 20, h: 1}
      - {chart: db08_mix, x: 0, y: 16, w: 10, h: 7}
      - {chart: db08_covers, x: 10, y: 16, w: 10, h: 7}
      - {text: "<p><b>Cancellations and cashiers</b> - cancelled value by the person who opened the order, and sales by cashier</p>", x: 0, y: 23, w: 20, h: 1}
      - {chart: db08_cancels, x: 0, y: 24, w: 10, h: 7}
      - {chart: db08_cashier, x: 10, y: 24, w: 10, h: 7}
      - {text: "<p>Cancelled value is credited to the person who opened the order, not necessarily who cancelled it. Covers count dine-in bills only.</p>", x: 0, y: 31, w: 20, h: 1}
      - {text: "<p><b>Not recorded yet:</b> cook speed, sales per labour hour and tips. Needs cook logins on the kitchen screen, attendance hours and a tips field on the bill.</p>", x: 0, y: 32, w: 20, h: 2}
