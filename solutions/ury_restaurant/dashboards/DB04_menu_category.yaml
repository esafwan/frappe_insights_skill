# DB04 Menu and category performance (portfolio section DB04). Audience: owner, branch manager, kitchen head.
# Base queries copied VERBATIM from semantic_layer.yaml (fact_sales_lines_enriched, dim_item); probes dropped.
# Population: Consolidated + Paid both included (item/category revenue). Category = CATEGORY_MAP v1 menu_category
# everywhere (never raw item_group). Department filter = CONFIGURED department (item + branch).
workbook: {id: ury_db04_menu_category, title: "URY DB04 Menu And Category", module: "URY", required_apps: [ury]}
queries:
  # fact_sales_lines_enriched (sql, T1/T2). Same grain as fact_sales_lines plus: cleaned menu_category and
  # category_family (CATEGORY_MAP v1), branch-safe configured department, BOM-based estimated cost.
  # Why sql: (1) the cleaned category is a 60-value CASE over Item Group; (2) the config join needs a composite key
  # (item AND branch), finsights joins take one equality pair; (3) BOM unit cost needs a filtered sub-select
  # (is_default=1, is_active=1, docstatus=1). Date column: posting_date. est_cost/est_margin are NULL when no recipe cost.
  - id: fact_sales_lines_enriched
    title: "fact_sales_lines_enriched"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item) SELECT pii.name AS line_id, pi.name AS invoice, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, pi.branch, pi.company, pi.order_type, pi.waiter, pi.cashier, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pii.item_code, pii.item_name, pii.item_group, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, COALESCE(NULLIF(ipc.department, ''), 'Unmapped') AS department, COALESCE(NULLIF(ipc.production_unit, ''), 'Unmapped') AS config_unit, ipc.production_policy, pii.warehouse, pii.qty, pii.amount AS gross_amount, pii.net_amount, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS cost_known, pii.qty * bc.bom_unit_cost AS est_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount END AS costed_net_amount, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount - pii.qty * bc.bom_unit_cost END AS est_margin FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 LEFT JOIN cm ON cm.item_group = pii.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = pii.item_code AND ipc.branch = pi.branch AND ipc.active = 1 LEFT JOIN bc ON bc.item = pii.item_code"

  # dim_item (sql). Grain: one Item x configured branch (one row per item while single-branch). Carries CATEGORY_MAP v1
  # (identical CASE to fact_sales_lines_enriched), configured department/unit/policy, recipe-cost coverage and yield
  # standard. Why sql: same CASE + composite/filtered joins as above. Use for coverage and data-quality charts.
  - id: dim_item
    title: "dim_item"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item), sold AS (SELECT DISTINCT pii.item_code FROM `tabPOS Invoice Item` pii WHERE pii.docstatus = 1) SELECT i.name AS item_code, i.item_name, i.item_group, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, ipc.branch, COALESCE(NULLIF(ipc.department, ''), 'Unmapped') AS department, COALESCE(NULLIF(ipc.production_unit, ''), 'Unmapped') AS config_unit, ipc.production_policy, ipc.controlled_by_sales_plan, i.is_stock_item, i.is_sales_item, i.disabled, CASE WHEN sold.item_code IS NULL THEN 0 ELSE 1 END AS is_sold, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS has_recipe_cost, i.valuation_rate, i.custom_yield_tracked, i.custom_yield_percent FROM `tabItem` i LEFT JOIN cm ON cm.item_group = i.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = i.name AND ipc.active = 1 LEFT JOIN bc ON bc.item = i.name LEFT JOIN sold ON sold.item_code = i.name"


charts:
  # S1 KPIs (SAL-001, MNU-002). No date on a Number chart: shows the TOTAL for the filtered rows.
  - {id: db04_kpi, title: "Menu KPIs", query: fact_sales_lines_enriched, type: Number,
     y: [{column: net_amount, agg: sum, as: Revenue, format: currency}, {column: qty, agg: sum, as: Qty}, {column: item_code, agg: count_distinct, as: Items}]}
  # S2 Category (MNU-005, MNU-006, DQ-003, MNU-010)
  - {id: db04_cat_rev, title: "Revenue by Category", query: fact_sales_lines_enriched, type: Row, limit: 15,
     x: menu_category, y: [{column: net_amount, agg: sum, as: Revenue}], order: [{by: Revenue, dir: desc}]}
  - {id: db04_family, title: "Revenue by Category Family", query: fact_sales_lines_enriched, type: Donut,
     x: category_family, y: [{column: net_amount, agg: sum, as: Revenue}]}
  - {id: db04_unassigned, title: "Unassigned Revenue", query: fact_sales_lines_enriched, type: Number,
     filters: [{column: menu_category, op: "=", value: Unassigned}],
     y: [{column: net_amount, agg: sum, as: Unassigned Revenue, format: currency}]}
  - {id: db04_bev_attach, title: "Beverage Bills", query: fact_sales_lines_enriched, type: Number,
     filters: [{column: category_family, op: "=", value: Beverage}],
     y: [{column: invoice, agg: count_distinct, as: Beverage Bills}]}
  # S3 Items (MNU-003, MNU-004)
  - {id: db04_top, title: "Top Items by Revenue", query: fact_sales_lines_enriched, type: Row, limit: 10,
     x: item_name, y: [{column: net_amount, agg: sum, as: Revenue}], order: [{by: Revenue, dir: desc}]}
  - {id: db04_bottom, title: "Bottom Items by Revenue", query: fact_sales_lines_enriched, type: Row, limit: 10,
     filters: [{column: category_family, op: "!=", value: Non-menu}],
     x: item_name, y: [{column: net_amount, agg: sum, as: Revenue}], order: [{by: Revenue, dir: asc}]}
  # S4 Detail (MNU-009)
  - {id: db04_item_table, title: "Item Sales Table", query: fact_sales_lines_enriched, type: Table, limit: 100,
     rows: [menu_category, item_name],
     y: [{column: qty, agg: sum, as: Qty}, {column: net_amount, agg: sum, as: Revenue}], order: [{by: Revenue, dir: desc}]}
  # S5 Margin view, T2 (MNU-012, MAR-007): ratios of sums over costed lines only
  - {id: db04_menu_eng, title: "Menu Engineering (Costed Items)", query: fact_sales_lines_enriched, type: Table, limit: 50,
     filters: [{column: cost_known, op: "=", value: 1}],
     rows: [item_name],
     y: [{column: qty, agg: sum, as: Qty},
         {expr: "sum(est_margin) / sum(qty)", as: Unit Margin},
         {expr: "sum(est_margin) / sum(costed_net_amount)", as: Margin Pct}],
     order: [{by: Qty, dir: desc}]}
  # S6 Non-selling, T2 (MNU-011): sellable, enabled, never sold on a submitted bill
  - {id: db04_nonselling, title: "Non-Selling Items", query: dim_item, type: Table, limit: 100,
     filters: [{column: is_sales_item, op: "=", value: 1}, {column: is_sold, op: "=", value: 0},
               {column: disabled, op: "=", value: 0}, {column: category_family, op: "!=", value: Non-menu}],
     rows: [menu_category, item_name], y: [{column: item_code, agg: count, as: Items}]}
dashboards:
  - id: db04_menu_category
    title: "URY DB04 Menu And Category"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, applies_to: {fact_sales_lines_enriched: posting_date}}
      - {id: f_branch, label: Branch, type: string, icon: map-pin, applies_to: {fact_sales_lines_enriched: branch}}
      - {id: f_category, label: Category, type: string, icon: tag, applies_to: {fact_sales_lines_enriched: menu_category}}
      - {id: f_department, label: Department, type: string, icon: layers, applies_to: {fact_sales_lines_enriched: department}}
      - {id: f_order_type, label: "Order Type", type: string, icon: shopping-bag, applies_to: {fact_sales_lines_enriched: order_type}}
    items:
      - {chart: db04_kpi, x: 0, y: 2, w: 20, h: 3}
      - {chart: db04_cat_rev, x: 0, y: 5, w: 10, h: 10}
      - {chart: db04_family, x: 10, y: 5, w: 5, h: 10}
      - {chart: db04_unassigned, x: 15, y: 5, w: 5, h: 5}
      - {chart: db04_bev_attach, x: 15, y: 10, w: 5, h: 5}
      - {chart: db04_top, x: 0, y: 15, w: 10, h: 9}
      - {chart: db04_bottom, x: 10, y: 15, w: 10, h: 9}
      - {chart: db04_item_table, x: 0, y: 24, w: 20, h: 10}
      - {chart: db04_menu_eng, x: 0, y: 34, w: 12, h: 9}
      - text: "**T2** Margin shown only for items with a default BOM cost (MAR-005 coverage about 6-8% of revenue). Roadmap R2."
        x: 12
        y: 34
        w: 8
        h: 4
      - {chart: db04_nonselling, x: 12, y: 38, w: 8, h: 5}
